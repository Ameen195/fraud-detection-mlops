# Paths and split dates are placeholders; real split dates are set in Phase 2 after EDA.
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: eval/results
data:
  transaction_file: train_transaction.csv
  identity_file: train_identity.csv
  time_column: TransactionDT
  target: isFraud
split:
  train_frac: 0.6   # time-ordered: earliest 60% train, next 20% validation, last 20% test
  valid_frac: 0.2
train:
  seed: 42
  v_columns: auto   # auto: drop V* if LightGBM valid PR-AUC gap (with - without) < v_gap_max; or keep / drop
  v_gap_max: 0.02
  optuna_trials: 20
  min_tuning_gain: 0.005   # tuned LightGBM must beat best default by this valid PR-AUC to be champion
mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_dir: mlruns
  experiment: fraudguard
  model_name: fraudguard
business:
  cost_per_false_alarm: 5.0   # assumption, in dataset currency; documented in README
monitoring:
  label_delay_days: 30        # assumption: a fraud label (chargeback) is known 30 days after the transaction
  batch_days: 7               # replay validation + test as weekly "production" batches
  drift_features: 20          # monitor the top-N features by SHAP importance (shap_global.json)
  reference_rows: 30000       # random sample of train used as the drift reference
  drift_share_alarm: 0.3      # alarm when >= this share of monitored features drift
  score_psi_alarm: 0.1        # alarm when the score distribution PSI vs. the first week >= this
  retrain_every_weeks: 4      # scheduled retrain, even without a drift alarm
  eval_window_days: 14        # newest labeled days held out to compare challenger vs champion
  min_promotion_gain: 0.005   # challenger must beat champion PR-AUC by this on the eval window
  replay_model_name: fraudguard_replay   # separate registry name; the served `fraudguard` is untouched
