# Paths and split dates are placeholders; real split dates are set in Phase 2 after EDA.
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: eval/results
data:
  transaction_file: train_transaction.csv
  identity_file: train_identity.csv
  time_column: TransactionDT
  target: isFraud
split:
  train_frac: 0.6   # time-ordered: earliest 60% train, next 20% validation, last 20% test
  valid_frac: 0.2
train:
  seed: 42
  v_columns: auto   # auto: drop V* if LightGBM valid PR-AUC gap (with - without) < v_gap_max; or keep / drop
  v_gap_max: 0.02
  optuna_trials: 20
  min_tuning_gain: 0.005   # tuned LightGBM must beat best default by this valid PR-AUC to be champion
mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_dir: mlruns
  experiment: fraudguard
  model_name: fraudguard
business:
  cost_per_false_alarm: 5.0   # assumption, in dataset currency; documented in README
