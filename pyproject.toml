[project]
name = "fraudguard"
version = "0.1.0"
description = "Real-time fraud detection for digital payment transactions, with MLOps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "pyyaml",
    "matplotlib>=3.11.2",
    "xgboost>=3.4.1",
    "mlflow>=3.18.0",
    "optuna>=5.1.0",
    "shap>=0.54.1",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "httpx>=0.28.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudguard"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
