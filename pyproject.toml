[project]
name = "fraudguard"
version = "0.1.0"
description = "Real-time fraud detection for digital payment transactions, with MLOps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "pyyaml",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudguard"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
